<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img" aria-labelledby="title desc"><title id="title">从 Blender 到浏览器</title><desc id="desc">Blender 可编辑工程 → 导出场景资产 → Three.js 浏览器体验</desc><rect width="680" height="580" rx="18" fill="#f3f2eb"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect x="24" y="24" width="632" height="152" rx="12" fill="#e9ece1" stroke="#c5d4cd"/><text x="48" y="68" font-size="23" fill="#647d72">01</text><text x="100" y="68" font-size="30" font-weight="600" fill="#233f3b">Blender 可编辑工程</text><text x="100" y="108" font-size="25" fill="#344c47">地形、建筑、船与三位居民</text><text x="100" y="144" font-size="23" fill="#51635b">保存模型与自制服装</text><path d="M340 181v17m-7-6 7 7 7-7" fill="none" stroke="#6a8a7c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="208" width="632" height="152" rx="12" fill="#e0eeeb" stroke="#c5d4cd"/><text x="48" y="252" font-size="23" fill="#647d72">02</text><text x="100" y="252" font-size="30" font-weight="600" fill="#233f3b">导出场景资产</text><text x="100" y="292" font-size="25" fill="#344c47">GLB 模型与 WebP 贴图</text><text x="100" y="328" font-size="23" fill="#51635b">作为网页加载的输入</text><path d="M340 365v17m-7-6 7 7 7-7" fill="none" stroke="#6a8a7c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="392" width="632" height="152" rx="12" fill="#ddeaf0" stroke="#c5d4cd"/><text x="48" y="436" font-size="23" fill="#647d72">03</text><text x="100" y="436" font-size="30" font-weight="600" fill="#233f3b">Three.js 浏览器体验</text><text x="100" y="476" font-size="25" fill="#344c47">动态水面、昼夜灯光与人物动作</text><text x="100" y="512" font-size="23" fill="#51635b">鱼鸟路径、环境音与点击互动</text></g></svg>
